[project]
name = "log-scaling"
version = "0.1.0"
description = "Storage layout and query experiments for ~1B event rows"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "psutil>=7.2.2",
    "sqlglot>=25",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
pg = ["psycopg[binary]>=3.2"]   # only for the postgres comparison

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E501", "SIM", "RET", "ARG", "ERA"]
